name: Publish @unconfirmed/onara SDK

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

concurrency:
  group: publish-onara-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@12.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify tag matches package version
        working-directory: sdk
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node --print "require('./package.json').version")
          test "$RELEASE_TAG" = "sdk-v$PACKAGE_VERSION"

      - name: Test
        working-directory: sdk
        run: bun test

      - name: Build
        working-directory: sdk
        run: bun run build

      - name: Publish
        working-directory: sdk
        run: npm publish
